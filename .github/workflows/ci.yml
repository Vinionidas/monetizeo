name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regras financeiras (Node)
        run: npm test
      - name: Servidor (Python)
        run: python -m unittest discover tests
      - name: Sintaxe dos arquivos do app
        run: for f in app/js/*.js app/js/views/*.js; do node --check "$f"; done
